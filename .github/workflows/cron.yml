name: Wöchentlicher KI News Aggregator

on:
  schedule:
    # Läuft jeden Sonntag um 22:00 Uhr UTC
    - cron: '0 22 * * 0'
  workflow_dispatch: # Ermöglicht den manuellen Start

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Hier geben wir dem Server explizit die Rechte, Dateien ins Repository zu schreiben
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Fetch News Script
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python fetch_news.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add news.json
        git commit -m "Automatisches KI-News-Update" || echo "Keine Änderungen gefunden"
        git push

