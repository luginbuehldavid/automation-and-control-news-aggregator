name: Wöchentlicher KI News Aggregator

on:
  schedule:
    # Läuft jeden Sonntag um 22:00 Uhr UTC (23:00 Uhr deutscher Winterzeit)
    - cron: '0 22 * * 7'
  workflow_dispatch: # Ermöglicht es dir, den Lauf jederzeit manuell zu starten

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Den Code aus dem Repository laden
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Python auf dem Server installieren
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-month: '3.10'

    # 3. Die Werkzeuge vom Einkaufszettel (requirements.txt) installieren
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Das Skript ausführen und den API-Key sicher übergeben
    - name: Run Fetch News Script
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python fetch_news.py

    # 5. Die neu erstellte news.json zurück ins Repository speichern
    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add news.json
        git commit -m "Automatisches KI-News-Update" || echo "Keine Änderungen gefunden"
        git push
